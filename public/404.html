<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex, nofollow"
    />
    <title>404 - Pagina non trovata</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #0b0f14;
        color: #f5f7fa;
      }

      main {
        width: min(90%, 640px);
        padding: 3rem 2rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        color: #66e3a4;
        font-size: clamp(4rem, 12vw, 8rem);
        line-height: 1;
      }

      h2 {
        margin: 1rem 0;
        font-size: clamp(1.5rem, 4vw, 2.5rem);
      }

      p {
        margin: 0 auto 2rem;
        color: #aab4c0;
        font-size: 1.1rem;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        border: 1px solid #66e3a4;
        border-radius: 0.5rem;
        color: #66e3a4;
        text-decoration: none;
        transition:
          background-color 0.2s ease,
          color 0.2s ease;
      }

      a:hover {
        background: #66e3a4;
        color: #0b0f14;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <h2>Pagina non trovata</h2>
      <p>
        La pagina che stai cercando non esiste oppure è stata spostata.
      </p>
      <a href="/">← Torna alla home</a>
    </main>
  </body>
</html>
